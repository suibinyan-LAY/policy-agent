name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python 语法与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q app
      - name: 导入检查
        run: DASHSCOPE_API_KEY=test python -c "import app.main"

  node:
    name: Node 部署版语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 语法检查
        run: node --check deploy-node/server.js
