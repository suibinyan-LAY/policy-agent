<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>企业制度问答助手</title>
<style>
  :root {
    --bg: #F4F6F9;
    --surface: #FFFFFF;
    --surface-2: #F7F8FA;
    --text: #12141A;
    --text-2: #4A5260;
    --text-3: #8B929C;
    --border: #E5E8ED;
    --border-strong: #D8DDE5;
    --brand: #0FDC78;
    --brand-2: #0BB863;
    --brand-soft: #E7FBF0;
    --brand-line: #C6F0D9;
    --on-brand: #00351B;
    --mark: #CFF7E1;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-md: 0 12px 34px rgba(16, 24, 40, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D1015;
      --surface: #151A21;
      --surface-2: #1A2029;
      --text: #E9EDF2;
      --text-2: #A8B1BE;
      --text-3: #6E7886;
      --border: #242C37;
      --border-strong: #2E3743;
      --brand-soft: #0F2E20;
      --brand-line: #1B4631;
      --brand-ink: #6FF0B4;
      --on-brand: #00351B;
      --mark: #1E5C3C;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 14px 36px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 40px;
    background:
      radial-gradient(820px 380px at 12% -6%, rgba(15, 220, 120, .16), transparent 62%),
      radial-gradient(720px 340px at 92% 2%, rgba(79, 140, 255, .12), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 860px; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .logo {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(140deg, #19EC8B, #0AAE5D);
    display: grid;
    place-items: center;
    color: #00351B;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: .5px;
    box-shadow: 0 8px 20px rgba(15, 220, 120, .28), inset 0 1px 0 rgba(255, 255, 255, .45);
  }
  h1 { font-size: 19px; margin: 0; font-weight: 680; letter-spacing: .2px; }
  .sub { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
  .tools { display: flex; align-items: center; gap: 8px; }
  select, .ghost {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-2);
    font-size: 12.5px;
    outline: none;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  select:focus { border-color: var(--brand); }
  .model-custom {
    width: 168px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
  }
  .model-custom:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 220, 120, .14); }
  .ghost:hover { border-color: var(--brand); color: var(--brand-ink); }

  /* ---------- 密钥栏 ---------- */
  .keybar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .keybar label { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  #key {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #key::placeholder { color: var(--text-3); }
  #key:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 220, 120, .14); }

  /* ---------- 分段控件 ---------- */
  .seg {
    display: inline-flex;
    gap: 2px;
    padding: 4px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
  }
  .seg button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 0;
    background: transparent;
    padding: 8px 15px;
    border-radius: 999px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  .seg button svg { width: 14px; height: 14px; opacity: .75; }
  .seg button.active {
    background: var(--brand-soft);
    color: var(--brand-ink);
    font-weight: 600;
  }
  .seg button.active svg { opacity: 1; }

  /* ---------- 主面板 ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  #log {
    padding: 24px;
    min-height: 360px;
    max-height: 56vh;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  #log::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 空状态 ---------- */
  .empty { text-align: center; padding: 46px 12px 38px; }
  .empty-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: var(--brand-soft);
    color: var(--brand-ink);
    border: 1px solid var(--brand-line);
  }
  .empty-title { font-size: 15.5px; font-weight: 650; }
  .empty-sub { font-size: 12.5px; color: var(--text-3); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    color: var(--text-2);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease, transform .15s ease;
  }
  .chip:hover {
    border-color: var(--brand);
    background: var(--brand-soft);
    color: var(--brand-ink);
    transform: translateY(-1px);
  }
  .chip svg { width: 12px; height: 12px; opacity: .6; }

  /* ---------- 消息 ---------- */
  .msg { display: flex; gap: 11px; margin-bottom: 20px; animation: rise .26s ease both; }
  .msg.user { flex-direction: row-reverse; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 10px;
    flex: none;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid transparent;
  }
  .ai .avatar {
    background: var(--brand-soft);
    color: var(--brand-ink);
    border-color: var(--brand-line);
  }
  .user .avatar {
    background: var(--surface-2);
    color: var(--text-2);
    border-color: var(--border);
  }
  .body { min-width: 0; max-width: calc(100% - 41px); }
  .user .body { display: flex; flex-direction: column; align-items: flex-end; }
  .who {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: var(--text-3);
    margin-bottom: 6px;
  }
  .badge {
    background: var(--brand-soft);
    color: var(--brand-ink);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 10.5px;
    border: 1px solid var(--brand-line);
  }
  .bubble {
    font-size: 14.5px;
    line-height: 1.78;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ai .bubble {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px 12px 12px 4px;
    padding: 11px 14px;
    color: var(--text-2);
  }
  .user .bubble {
    background: linear-gradient(180deg, var(--brand-soft), var(--brand-soft));
    border: 1px solid var(--brand-line);
    border-radius: 12px 12px 4px 12px;
    padding: 11px 14px;
    color: var(--text);
  }
  .msg-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
  .copy {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-3);
    border-radius: 7px;
    padding: 3px 9px;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s ease, border-color .15s ease, color .15s ease;
  }
  .msg:hover .copy { opacity: 1; }
  .copy:hover { border-color: var(--brand); color: var(--brand-ink); }

  /* ---------- 引用卡片 ---------- */
  .src {
    margin-top: 9px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--brand);
    border-radius: 4px 10px 10px 4px;
    font-size: 12.5px;
  }
  .src summary {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-3);
    cursor: pointer;
    list-style: none;
  }
  .src summary::-webkit-details-marker { display: none; }
  .src summary::before { content: "▸"; font-size: 10px; }
  .src[open] summary::before { content: "▾"; }
  .src .score {
    margin-left: auto;
    padding: 1px 8px;
    background: var(--brand-soft);
    color: var(--brand-ink);
    border: 1px solid var(--brand-line);
    border-radius: 999px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .src-body {
    margin-top: 9px;
    color: var(--text-2);
    line-height: 1.78;
    white-space: pre-wrap;
  }
  mark {
    background: var(--mark);
    color: inherit;
    border-radius: 3px;
    padding: 0 2px;
  }

  /* ---------- 执行轨迹 ---------- */
  .trace {
    margin-top: 9px;
    padding: 11px 13px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--brand);
    border-radius: 4px 10px 10px 4px;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 11.5px;
    line-height: 1.75;
    color: var(--text-2);
    white-space: pre-wrap;
  }

  /* ---------- 输入区 ---------- */
  .composer {
    display: flex;
    gap: 9px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #q {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #q::placeholder { color: var(--text-3); }
  #q:focus {
    border-color: var(--brand);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(15, 220, 120, .14);
  }
  #send {
    width: 46px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(140deg, #17E788, #0CB45F);
    color: var(--on-brand);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(15, 220, 120, .25);
    transition: transform .12s ease, opacity .15s ease, box-shadow .15s ease;
  }
  #send:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(15, 220, 120, .32); }
  #send:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-3);
  }
  .foot a { color: var(--text-3); text-decoration: none; }
  .foot a:hover { color: var(--brand-ink); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
    color: var(--text-3);
  }

  /* ---------- 状态与动画 ---------- */
  .status { display: inline-flex; align-items: center; gap: 7px; color: var(--text-3); font-size: 13px; }
  .spin {
    width: 11px;
    height: 11px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--brand-2);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots { display: inline-flex; gap: 4px; padding: 5px 0; }
  .dots i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border-strong);
    animation: blink 1.2s infinite;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: .35; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  @media (max-width: 640px) {
    body { padding: 20px 12px 32px; }
    .topbar { align-items: flex-start; flex-direction: column; }
    .tools { width: 100%; }
    .tools select { flex: 1; }
    #log { padding: 16px; max-height: 58vh; }
    h1 { font-size: 17.5px; }
    .seg { width: 100%; justify-content: space-between; }
    .seg button { flex: 1; justify-content: center; padding: 8px 6px; }
    .foot { flex-direction: column; align-items: flex-start; gap: 6px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">政</div>
      <div>
        <h1>企业制度问答助手</h1>
        <div class="sub">RAG 检索 · Agent 工具调用 · 流式输出</div>
      </div>
    </div>
    <div class="tools">
      <select id="model"></select>
      <input id="customModel" class="model-custom" placeholder="自定义模型 ID" hidden>
      <button class="ghost" id="clear">清空</button>
    </div>
  </div>

  <div class="keybar">
    <label for="key">API Key</label>
    <input id="key" type="password" placeholder="填入你自己的 Key，只保存在本机浏览器">
    <button class="ghost" id="savekey">记住</button>
  </div>

  <div class="seg">
    <button class="active" data-mode="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.5-5A8 8 0 1 1 21 12z"/>
      </svg>
      普通对话
    </button>
    <button data-mode="kb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 5v14a2 2 0 0 0 2 2h13V3H6a2 2 0 0 0-2 2z"/>
        <path d="M8 8h6"/>
      </svg>
      知识库问答
    </button>
    <button data-mode="agent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="4" y="7" width="16" height="12" rx="3"/>
        <path d="M12 3v4M9 12h.01M15 12h.01"/>
      </svg>
      Agent 模式
    </button>
  </div>

  <div class="panel">
    <div id="log">
      <div class="empty" id="empty">
        <div class="empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round">
            <path d="M7 3h7l5 5v13H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
            <path d="M14 3v5h5"/>
            <circle cx="11.5" cy="14.5" r="2.5"/>
            <path d="M13.4 16.4 15 18"/>
          </svg>
        </div>
        <div class="empty-title">今天想查什么？</div>
        <div class="empty-sub">从下面的问题开始，或直接输入你自己的问题</div>
        <div class="chips">
          <button class="chip">上海出差住宿一晚最多能报多少？<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="chip">报销单最晚什么时候提交？<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="chip">IT 账号多久能开通？<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>
    <div class="composer">
      <input id="q" type="text" placeholder="输入问题，回车发送…" autocomplete="off">
      <button id="send" title="发送" aria-label="发送">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="foot">
    <span id="hint">普通对话：纯聊天，不带资料 · 知识库问答：先检索再回答 · Agent：模型自己决定要不要查</span>
    <span class="tags">
      <span class="tag">FastAPI</span>
      <span class="tag">RAG</span>
      <span class="tag">SSE</span>
      <a href="https://github.com/suibinyan-LAY/policy-agent" target="_blank" rel="noreferrer">源码 ↗</a>
    </span>
  </div>
</div>

<script>
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const input = document.getElementById('q');
const btn = document.getElementById('send');
const modelSel = document.getElementById('model');
const hint = document.getElementById('hint');
const clearBtn = document.getElementById('clear');
const keyInput = document.getElementById('key');
const saveKeyBtn = document.getElementById('savekey');

keyInput.value = localStorage.getItem('policy_agent_key') || '';

function apiKey() {
  return keyInput.value.trim();
}

saveKeyBtn.addEventListener('click', () => {
  localStorage.setItem('policy_agent_key', apiKey());
  hint.textContent = apiKey() ? 'Key 已保存在浏览器本地' : '已清除 Key';
});

let mode = 'chat';
let history = [];

const HINTS = {
  chat: '普通对话：纯聊天，模型只靠自己的知识回答',
  kb: '知识库问答：先从 data/ 里的文档检索，再依据原文回答',
  agent: 'Agent 模式：模型自己决定调不调 search_policy 工具，并显示执行轨迹'
};

const BADGES = { chat: '对话', kb: '知识库', agent: 'Agent' };

const PLACEHOLDERS = {
  chat: '随便聊聊，回车发送…',
  kb: '问一个公司制度相关的问题…',
  agent: '问一个需要查资料的制度问题…'
};

const customModel = document.getElementById('customModel');

fetch('/api/config').then(r => r.json()).then(cfg => {
  const options = cfg.models.map(m => {
    const id = typeof m === 'string' ? m : m.id;
    const label = typeof m === 'string' ? m : (m.label || m.id);
    return `<option value="${id}">${label}</option>`;
  });
  options.push('<option value="__custom__">自定义模型…</option>');
  modelSel.innerHTML = options.join('');
  modelSel.value = cfg.default;
}).catch(() => {
  modelSel.innerHTML = '<option>无法读取配置</option>';
});

function currentModel() {
  return modelSel.value === '__custom__' ? customModel.value.trim() : modelSel.value;
}

modelSel.addEventListener('change', () => {
  const custom = modelSel.value === '__custom__';
  customModel.hidden = !custom;
  if (custom) {
    customModel.focus();
  } else {
    hint.textContent = HINTS[mode];
  }
});

document.querySelectorAll('.seg button').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    hint.textContent = HINTS[mode];
    input.placeholder = PLACEHOLDERS[mode];
  });
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    input.value = chip.textContent.trim();
    send();
  });
});

clearBtn.addEventListener('click', () => {
  log.innerHTML = '';
  log.appendChild(empty);
  empty.style.display = '';
  history = [];
  hint.textContent = HINTS[mode];
  input.focus();
});

function addMessage(role, text, badge) {
  if (empty && empty.parentElement) empty.style.display = 'none';

  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai');

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';

  const body = document.createElement('div');
  body.className = 'body';

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? '你' : '助手';
  if (role !== 'user' && badge) {
    const tag = document.createElement('span');
    tag.className = 'badge';
    tag.textContent = badge;
    who.appendChild(tag);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  body.appendChild(who);
  body.appendChild(bubble);

  if (role !== 'user') {
    const foot = document.createElement('div');
    foot.className = 'msg-foot';
    const copy = document.createElement('button');
    copy.className = 'copy';
    copy.textContent = '复制';
    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(bubble.textContent || '');
        copy.textContent = '已复制';
        setTimeout(() => { copy.textContent = '复制'; }, 1200);
      } catch {
        copy.textContent = '复制失败';
        setTimeout(() => { copy.textContent = '复制'; }, 1200);
      }
    });
    foot.appendChild(copy);
    body.appendChild(foot);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(body);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;

  return { bubble, body };
}

function showTyping(bubble) {
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
}

function showStatus(bubble, text) {
  bubble.innerHTML = '<span class="status"><span class="spin"></span></span>';
  bubble.querySelector('.status').appendChild(document.createTextNode(text));
}

async function send() {
  const q = input.value.trim();
  if (!q) return;

  if (!apiKey()) {
    hint.textContent = '请先在上方填入 API Key';
    keyInput.focus();
    return;
  }

  if (!currentModel()) {
    hint.textContent = '请填写自定义模型 ID，或从下拉框里选一个';
    customModel.focus();
    return;
  }

  input.value = '';
  btn.disabled = true;
  addMessage('user', q);

  try {
    if (mode === 'agent') {
      await runAgent(q);
    } else {
      await runChat(q);
    }
  } catch (e) {
    addMessage('ai', '出错了：' + e.message, BADGES[mode]);
  }

  btn.disabled = false;
  input.focus();
}

async function runChat(q) {
  const { bubble, body } = addMessage('ai', '', BADGES[mode]);
  showTyping(bubble);

  const resp = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey() },
    body: JSON.stringify({
      q,
      model: currentModel(),
      history,
      use_kb: mode === 'kb'
    })
  });

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let answer = '';
  let started = false;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });

    const parts = buf.split('\n\n');
    buf = parts.pop();

    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const payload = part.slice(6);
      if (payload === '[DONE]') continue;

      let evt;
      try { evt = JSON.parse(payload); } catch { continue; }

      if (evt.type === 'delta') {
        if (!started) { bubble.textContent = ''; started = true; }
        answer += evt.text;
        bubble.textContent = answer;
        log.scrollTop = log.scrollHeight;
      } else if (evt.type === 'status') {
        if (!started) showStatus(bubble, evt.text);
      } else if (evt.type === 'sources') {
        renderSources(body, evt.sources, q);
      } else if (evt.type === 'error') {
        bubble.textContent = '出错了：' + evt.text + modelHint(evt.text);
        started = true;
      }
    }
  }

  if (answer) {
    history.push({ role: 'user', content: q });
    history.push({ role: 'assistant', content: answer });
  }
}

async function runAgent(q) {
  const { bubble, body } = addMessage('ai', '', 'Agent');
  showStatus(bubble, '正在思考要查什么…');

  const resp = await fetch('/api/agent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey() },
    body: JSON.stringify({ q, model: currentModel() })
  });
  const data = await resp.json();

  if (data.error) {
    bubble.textContent = '出错了：' + data.error + modelHint(data.error);
    return;
  }

  bubble.textContent = data.answer || '（没有回答）';

  if (data.steps && data.steps.length) {
    const trace = data.steps
      .map((s, i) => `${i + 1}. ${s.tool}(${JSON.stringify(s.args)})`)
      .join('\n');
    const box = document.createElement('div');
    box.className = 'trace';
    box.textContent = trace;
    body.appendChild(box);
  }

  if (data.sources && data.sources.length) {
    renderSources(body, data.sources, q);
  }

  log.scrollTop = log.scrollHeight;
}

// 模型报错时给一句可操作的提示
function modelHint(text) {
  return /400|model|模型/i.test(text)
    ? '（可以换个模型，或用「自定义模型」填写你账号下可用的模型 ID）'
    : '';
}

// 把问题切成两字词，用来在原文里做高亮
function markTerm(html, term) {
  const safe = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(safe, 'g');
  return html
    .split(/(<[^>]+>)/g)
    .map(seg => (seg.startsWith('<') ? seg : seg.replace(re, m => `<mark>${m}</mark>`)))
    .join('');
}

function highlight(text, query) {
  const cleaned = query.replace(/[，。？！、；：""''（）()\s]/g, '');
  const terms = new Set();
  for (let i = 0; i + 2 <= cleaned.length; i++) terms.add(cleaned.slice(i, i + 2));

  let out = text.replace(/[&<>"]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  }[c]));

  for (const term of terms) out = markTerm(out, term);
  return out;
}

// 引用来源：可展开的原文片段，命中词高亮
function renderSources(parent, sources, query) {
  for (const s of sources) {
    if (!s.text) continue;

    const details = document.createElement('details');
    details.className = 'src';

    const summary = document.createElement('summary');
    summary.appendChild(document.createTextNode(s.source));

    const score = document.createElement('span');
    score.className = 'score';
    score.textContent = String(s.score);
    summary.appendChild(score);

    const body = document.createElement('div');
    body.className = 'src-body';
    body.innerHTML = highlight(s.text, query);

    details.appendChild(summary);
    details.appendChild(body);
    parent.appendChild(details);
  }
}

btn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
input.focus();
</script>
</body>
