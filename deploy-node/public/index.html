<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业制度问答助手</title>
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --surface-2: #F8F9FB;
    --text: #16181D;
    --text-2: #4B5563;
    --text-3: #8A9099;
    --border: #E6E8EC;
    --brand: #0FDC78;
    --brand-ink: #00381C;
    --brand-soft: #E9FBF1;
    --brand-line: #CBEFDB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 44px;
    background:
      radial-gradient(900px 420px at 50% -8%, #E9FBF1 0%, rgba(233, 251, 241, 0) 62%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 820px; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #12E383, #0BB863);
    display: grid;
    place-items: center;
    color: var(--brand-ink);
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 6px 16px rgba(15, 220, 120, .28);
  }
  h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .sub { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
  .tools { display: flex; align-items: center; gap: 8px; }
  select, .ghost {
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text-2);
    font-size: 12.5px;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: var(--brand); }
  .ghost:hover { border-color: var(--brand); color: var(--brand-ink); }

  /* ---------- 密钥栏 ---------- */
  .keybar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .keybar label { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  #key {
    flex: 1;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
  }
  #key:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 220, 120, .13); }

  /* ---------- 分段控件 ---------- */
  .seg {
    display: inline-flex;
    gap: 2px;
    padding: 4px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .seg button.active {
    background: var(--brand-soft);
    color: var(--brand-ink);
    font-weight: 600;
  }

  /* ---------- 主面板 ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px rgba(16, 24, 40, .05);
    overflow: hidden;
  }
  #log {
    padding: 22px;
    min-height: 340px;
    max-height: 56vh;
    overflow-y: auto;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: #DEE1E6; border-radius: 8px; }

  /* ---------- 空状态 ---------- */
  .empty { text-align: center; padding: 48px 12px 40px; }
  .empty-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .empty-sub { font-size: 12.5px; color: var(--text-3); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 12.5px;
    color: var(--text-2);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand-ink); background: var(--brand-soft); }

  /* ---------- 消息 ---------- */
  .msg { display: flex; gap: 10px; margin-bottom: 20px; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    flex: none;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
  }
  .ai .avatar { background: var(--brand-soft); color: var(--brand-ink); }
  .user .avatar { background: #EEF0F3; color: var(--text-2); }
  .body { min-width: 0; max-width: calc(100% - 38px); }
  .user .body { display: flex; flex-direction: column; align-items: flex-end; }
  .who {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-3);
    margin-bottom: 5px;
  }
  .badge {
    background: var(--brand-soft);
    color: var(--brand-ink);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 10.5px;
  }
  .bubble {
    font-size: 14.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ai .bubble { color: var(--text-2); }
  .user .bubble {
    background: var(--brand-soft);
    border: 1px solid var(--brand-line);
    border-radius: 12px 12px 4px 12px;
    padding: 10px 13px;
    color: var(--text);
  }

  /* ---------- 引用卡片 ---------- */
  .src {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12.5px;
  }
  .src summary {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-3);
    cursor: pointer;
    list-style: none;
  }
  .src summary::-webkit-details-marker { display: none; }
  .src summary::before { content: "▸"; font-size: 10px; color: var(--text-3); }
  .src[open] summary::before { content: "▾"; }
  .src .score {
    margin-left: auto;
    padding: 1px 8px;
    background: var(--brand-soft);
    color: var(--brand-ink);
    border-radius: 999px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .src-body {
    margin-top: 9px;
    color: var(--text-2);
    line-height: 1.75;
    white-space: pre-wrap;
  }
  mark {
    background: #CFF7E1;
    color: #00482A;
    border-radius: 3px;
    padding: 0 2px;
  }
  .src-note { margin-top: 8px; font-size: 11.5px; color: var(--text-3); }

  /* ---------- 执行轨迹 ---------- */
  .trace {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
    border-left: 2px solid var(--brand);
    border-radius: 0 8px 8px 0;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--text-2);
    white-space: pre-wrap;
  }

  /* ---------- 输入区 ---------- */
  .composer {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #q {
    flex: 1;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #q:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 220, 120, .13); }
  #send {
    width: 44px;
    border: 0;
    border-radius: 10px;
    background: var(--brand);
    color: var(--brand-ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .12s ease, opacity .15s ease;
  }
  #send:hover { transform: translateY(-1px); }
  #send:disabled { opacity: .4; cursor: default; transform: none; }
  .foot { margin-top: 10px; font-size: 12px; color: var(--text-3); text-align: center; }

  /* ---------- 打字动画 ---------- */
  .dots { display: inline-flex; gap: 4px; padding: 5px 0; }
  .dots i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #C4CAD3;
    animation: blink 1.2s infinite;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: .3; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  @media (max-width: 640px) {
    body { padding: 18px 12px 32px; }
    .topbar { align-items: flex-start; flex-direction: column; }
    .tools { width: 100%; }
    .tools select { flex: 1; }
    #log { padding: 16px; max-height: 58vh; }
    h1 { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">政</div>
      <div>
        <h1>企业制度问答助手</h1>
        <div class="sub">RAG 检索 · Agent 工具调用 · 流式输出</div>
      </div>
    </div>
    <div class="tools">
      <select id="model"></select>
      <button class="ghost" id="clear">清空</button>
    </div>
  </div>

  <div class="keybar">
    <label for="key">API Key</label>
    <input id="key" type="password" placeholder="填入你自己的 Key，只保存在本机浏览器">
    <button class="ghost" id="savekey">记住</button>
  </div>

  <div class="seg">
    <button class="active" data-mode="chat">普通对话</button>
    <button data-mode="kb">知识库问答</button>
    <button data-mode="agent">Agent 模式</button>
  </div>

  <div class="panel">
    <div id="log">
      <div class="empty" id="empty">
        <div class="empty-title">问点什么吧</div>
        <div class="empty-sub">从这里开始，或直接在下方输入你的问题</div>
        <div class="chips">
          <button class="chip">上海出差住宿一晚最多能报多少？</button>
          <button class="chip">报销单最晚什么时候提交？</button>
          <button class="chip">IT 账号多久能开通？</button>
        </div>
      </div>
    </div>
    <div class="composer">
      <input id="q" type="text" placeholder="输入问题后回车发送…" autocomplete="off">
      <button id="send" title="发送" aria-label="发送">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="foot" id="hint">普通对话：纯聊天，不带资料 · 知识库问答：先检索再回答 · Agent：模型自己决定要不要查</div>
</div>

<script>
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const input = document.getElementById('q');
const btn = document.getElementById('send');
const modelSel = document.getElementById('model');
const hint = document.getElementById('hint');
const clearBtn = document.getElementById('clear');
const keyInput = document.getElementById('key');
const saveKeyBtn = document.getElementById('savekey');

keyInput.value = localStorage.getItem('policy_agent_key') || '';

function apiKey() {
  return keyInput.value.trim();
}

saveKeyBtn.addEventListener('click', () => {
  localStorage.setItem('policy_agent_key', apiKey());
  hint.textContent = apiKey() ? 'Key 已保存在浏览器本地' : '已清除 Key';
});

let mode = 'chat';
let history = [];

const HINTS = {
  chat: '普通对话：纯聊天，模型只靠自己的知识回答',
  kb: '知识库问答：先从 data/ 里的文档检索，再依据原文回答',
  agent: 'Agent 模式：模型自己决定调不调 search_policy 工具，并显示执行轨迹'
};

const BADGES = { chat: '对话', kb: '知识库', agent: 'Agent' };

fetch('/api/config').then(r => r.json()).then(cfg => {
  modelSel.innerHTML = cfg.models.map(m => `<option value="${m}">${m}</option>`).join('');
  modelSel.value = cfg.default;
}).catch(() => {
  modelSel.innerHTML = '<option>无法读取配置</option>';
});

document.querySelectorAll('.seg button').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    hint.textContent = HINTS[mode];
  });
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    input.value = chip.textContent;
    send();
  });
});

clearBtn.addEventListener('click', () => {
  log.innerHTML = '';
  log.appendChild(empty);
  empty.style.display = '';
  history = [];
  hint.textContent = HINTS[mode];
});

function addMessage(role, text, badge) {
  if (empty && empty.parentElement) empty.style.display = 'none';

  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai');

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';

  const body = document.createElement('div');
  body.className = 'body';

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? '你' : '助手';
  if (role !== 'user' && badge) {
    const tag = document.createElement('span');
    tag.className = 'badge';
    tag.textContent = badge;
    who.appendChild(tag);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  body.appendChild(who);
  body.appendChild(bubble);
  wrap.appendChild(avatar);
  wrap.appendChild(body);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;

  return { bubble, body };
}

function showTyping(bubble) {
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
}

async function send() {
  const q = input.value.trim();
  if (!q) return;

  if (!apiKey()) {
    hint.textContent = '请先在上方填入 API Key';
    keyInput.focus();
    return;
  }

  input.value = '';
  btn.disabled = true;
  addMessage('user', q);

  try {
    if (mode === 'agent') {
      await runAgent(q);
    } else {
      await runChat(q);
    }
  } catch (e) {
    addMessage('ai', '出错了：' + e.message, BADGES[mode]);
  }

  btn.disabled = false;
  input.focus();
}

async function runChat(q) {
  const { bubble, body } = addMessage('ai', '', BADGES[mode]);
  showTyping(bubble);

  const resp = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey() },
    body: JSON.stringify({
      q,
      model: modelSel.value,
      history,
      use_kb: mode === 'kb'
    })
  });

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let answer = '';
  let started = false;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });

    const parts = buf.split('\n\n');
    buf = parts.pop();

    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const payload = part.slice(6);
      if (payload === '[DONE]') continue;

      let evt;
      try { evt = JSON.parse(payload); } catch { continue; }

      if (evt.type === 'delta') {
        if (!started) { bubble.textContent = ''; started = true; }
        answer += evt.text;
        bubble.textContent = answer;
        log.scrollTop = log.scrollHeight;
      } else if (evt.type === 'status') {
        if (!started) showTyping(bubble);
      } else if (evt.type === 'sources') {
        renderSources(body, evt.sources, q);
      } else if (evt.type === 'error') {
        bubble.textContent = '出错了：' + evt.text;
        started = true;
      }
    }
  }

  if (answer) {
    history.push({ role: 'user', content: q });
    history.push({ role: 'assistant', content: answer });
  }
}

async function runAgent(q) {
  const { bubble, body } = addMessage('ai', '', 'Agent');
  showTyping(bubble);

  const resp = await fetch('/api/agent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey() },
    body: JSON.stringify({ q, model: modelSel.value })
  });
  const data = await resp.json();

  if (data.error) {
    bubble.textContent = '出错了：' + data.error;
    return;
  }

  bubble.textContent = data.answer || '（没有回答）';

  if (data.steps && data.steps.length) {
    const trace = data.steps
      .map((s, i) => `${i + 1}. ${s.tool}(${JSON.stringify(s.args)})`)
      .join('\n');
    const box = document.createElement('div');
    box.className = 'trace';
    box.textContent = trace;
    body.appendChild(box);
  }

  if (data.sources && data.sources.length) {
    renderSources(body, data.sources, q);
  }

  log.scrollTop = log.scrollHeight;
}

// 把问题切成两字词，用来在原文里做高亮
function markTerm(html, term) {
  const safe = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(safe, 'g');
  return html
    .split(/(<[^>]+>)/g)
    .map(seg => (seg.startsWith('<') ? seg : seg.replace(re, m => `<mark>${m}</mark>`)))
    .join('');
}

function highlight(text, query) {
  const cleaned = query.replace(/[，。？！、；：""''（）()\s]/g, '');
  const terms = new Set();
  for (let i = 0; i + 2 <= cleaned.length; i++) terms.add(cleaned.slice(i, i + 2));

  let out = text.replace(/[&<>"]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  }[c]));

  for (const term of terms) out = markTerm(out, term);
  return out;
}

// 引用来源：可展开的原文片段，命中词高亮
function renderSources(parent, sources, query) {
  for (const s of sources) {
    if (!s.text) continue;

    const details = document.createElement('details');
    details.className = 'src';

    const summary = document.createElement('summary');
    summary.appendChild(document.createTextNode(s.source));

    const score = document.createElement('span');
    score.className = 'score';
    score.textContent = String(s.score);
    summary.appendChild(score);

    const body = document.createElement('div');
    body.className = 'src-body';
    body.innerHTML = highlight(s.text, query);

    details.appendChild(summary);
    details.appendChild(body);
    parent.appendChild(details);
  }
}

btn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
